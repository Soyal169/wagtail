<div class="code-block-container relative group my-6">
  <div class="flex items-center justify-between rounded-t-xl bg-slate-950 border border-b-0 border-slate-800 px-4 py-2 text-xs font-mono text-slate-400">
    <div class="flex items-center gap-2">
      <div class="flex items-center space-x-1.5">
        <span class="w-2 h-2 rounded-full bg-rose-500/70"></span>
        <span class="w-2 h-2 rounded-full bg-amber-500/70"></span>
        <span class="w-2 h-2 rounded-full bg-emerald-500/70"></span>
      </div>
      <span>{{ value.filename|default:"code.py" }}</span>
    </div>
    <button type="button" class="copy-code-btn text-slate-400 hover:text-emerald-400 text-[11px] font-mono flex items-center gap-1 transition-colors px-2 py-0.5 rounded hover:bg-slate-800" aria-label="Copy code to clipboard">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
      <span class="btn-text">copy</span>
    </button>
  </div>
  <div class="p-5 rounded-b-xl bg-slate-900 dark:bg-slate-950 border border-slate-800 font-mono text-xs overflow-x-auto pygments-code">{{ highlighted_code }}</div>
</div>
