{% load static wagtailcore_tags %}
<title>{% block title %}{% if page.seo_title %}{{ page.seo_title }}{% else %}{{ page.title }}{% endif %} | {{ settings.core.SiteBrandSettings.site_name }}{% endblock %}</title>
<meta name="description" content="{% block meta_description %}{{ page.search_description }}{% endblock %}" />
<meta name="author" content="{{ settings.core.SiteBrandSettings.site_name }}" />
<link rel="canonical" href="{% block canonical_url %}{{ request.build_absolute_uri }}{% endblock %}" />

<link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}" />
<link rel="manifest" href="{% static 'site.webmanifest' %}" />
<meta name="theme-color" content="#090d16" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/styles.css' %}">

<meta property="og:type" content="{% block og_type %}website{% endblock %}" />
<meta property="og:url" content="{{ request.build_absolute_uri }}" />
<meta property="og:site_name" content="{{ settings.core.SiteBrandSettings.site_name }}" />
<meta property="og:title" content="{% block og_title %}{% if page.seo_title %}{{ page.seo_title }}{% else %}{{ page.title }}{% endif %}{% endblock %}" />
<meta property="og:description" content="{% block og_description %}{{ page.search_description }}{% endblock %}" />
{% block twitter_meta %}{% endblock %}

{% block json_ld %}{% endblock %}
