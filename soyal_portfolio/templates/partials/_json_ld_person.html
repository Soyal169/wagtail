{% load core_tags %}
{% with brand=settings.core.SiteBrandSettings %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ nav_pages.home.full_url }}#person",
      "name": "{{ brand.person_name|escapejs }}",
      "jobTitle": "{{ brand.person_job_title|escapejs }}",
      "url": "{{ nav_pages.home.full_url }}",
      "worksFor": {
        "@type": "Organization",
        "name": "{{ brand.org_name|escapejs }}"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "{{ brand.location|escapejs }}"
      },
      "knowsAbout": [{% for skill in brand.knows_about|split:"," %}"{{ skill|escapejs }}"{% if not forloop.last %}, {% endif %}{% endfor %}],
      "sameAs": ["{{ brand.github_url|escapejs }}", "{{ brand.linkedin_url|escapejs }}"]
    },
    {
      "@type": "WebSite",
      "@id": "{{ nav_pages.home.full_url }}#website",
      "url": "{{ nav_pages.home.full_url }}",
      "name": "{{ brand.site_name|escapejs }}",
      "publisher": { "@id": "{{ nav_pages.home.full_url }}#person" }
    }
  ]
}
</script>
{% endwith %}
